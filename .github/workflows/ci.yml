name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/install.sh scripts/wxlogin.sh
      - run: npm run check:package
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-pil
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: xvfb-run -a -s '-screen 0 800x600x24 -nolisten tcp' cargo test --locked --test x11 -- --ignored --test-threads=1
